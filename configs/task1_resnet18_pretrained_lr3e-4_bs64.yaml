experiment_name: resnet18_pretrained_lr3e-4_bs64
seed: 42
data_root: data
output_dir: runs/task1
checkpoint_dir: checkpoints/task1

model:
  name: resnet18
  num_classes: 102
  pretrained: true
  attention: none
  freeze_backbone: false

train:
  epochs: 30
  batch_size: 64
  num_workers: 4
  image_size: 224
  optimizer: adamw
  learning_rate: 0.0003
  backbone_learning_rate: 0.00003
  head_learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  amp: true
  early_stop_patience: 8

logging:
  backend: none
  project: dl-spatial-hw2-task1
