experiment_name: resnet18_scratch_lr1e-3_bs32
seed: 42
data_root: data
output_dir: runs/task1
checkpoint_dir: checkpoints/task1

model:
  name: resnet18
  num_classes: 102
  pretrained: false
  attention: none
  freeze_backbone: false

train:
  epochs: 30
  batch_size: 32
  num_workers: 4
  image_size: 224
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  amp: true
  early_stop_patience: 8

logging:
  backend: none
  project: dl-spatial-hw2-task1
